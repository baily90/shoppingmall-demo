packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@ai-sdk/deepseek@3.0.74'
  - '@ai-sdk/gateway@4.0.127 || 4.0.136'
  - '@ai-sdk/openai-compatible@3.0.79'
  - '@ai-sdk/provider-utils@5.0.69 || 5.0.75'
  - ai@7.0.154 || 7.0.163
  - '@ai-sdk/mcp@2.0.91'
  - '@ai-sdk/provider@4.0.36'
  - '@ai-sdk/react@4.0.167'
