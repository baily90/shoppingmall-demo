# 生产编排（自托管基线：PostgreSQL + Redis + MinIO + 三端应用）
# 镜像由 CI（云效 Flow）构建后 push 到 ACR，这里只 pull、不 build。
# 运行：export IMAGE_TAG=<gitSHA前7位> && docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# 上云可整体替换成 RDS / 云 Redis(Tair) / OSS（存储层 S3 兼容，换 OSS 只改 MINIO_* + 换一个 StorageService 实现）
services:
  # 一次性迁移：应用前先跑 prisma migrate deploy，保证 server 启动时 schema 已就绪
  migrate:
    image: ${REGISTRY}/mall-server:${IMAGE_TAG:-latest}
    command: sh -c "cd apps/server && npx prisma migrate deploy"
    env_file: .env.prod
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  server:
    image: ${REGISTRY}/mall-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  h5:
    image: ${REGISTRY}/mall-h5:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '8080:80'

  admin:
    image: ${REGISTRY}/mall-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '8081:80'

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mall123}
      POSTGRES_DB: ${POSTGRES_DB:-mall}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # 用 Chainguard 镜像（与本地 dev 一致）；官方 minio/minio 已从 Docker Hub 下架，且 UBI 版无 curl
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  miniodata:
